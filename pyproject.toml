[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bili2music"
version = "0.1.0"
description = "LLM-driven CLI that curates and downloads Bilibili favorites / search results as audio or video"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zengyi", email = "124375@runjian.com" }]
keywords = [
    "bilibili",
    "b2m",
    "audio",
    "downloader",
    "cli",
    "llm",
    "yt-dlp",
    "music",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "yt-dlp>=2025.1.1",
    "rich>=13.7",
    "qrcode>=8.0",
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=5"]

[project.scripts]
b2m = "bili2music.cli:main"

[project.urls]
Homepage = "https://github.com/QinzYee/bili2music_cli"
Repository = "https://github.com/QinzYee/bili2music_cli"
Issues = "https://github.com/QinzYee/bili2music_cli/issues"
Changelog = "https://github.com/QinzYee/bili2music_cli/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/bili2music/"

[tool.setuptools.packages.find]
include = ["bili2music*"]

[tool.setuptools.package-data]
bili2music = ["skills/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
